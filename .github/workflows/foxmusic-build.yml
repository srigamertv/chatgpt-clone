name: FoxMusic Windows Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/foxmusic-build.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.2'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Spotube v5.1.2 base
        shell: pwsh
        run: git clone --depth 1 --branch v5.1.2 https://github.com/KRTirtho/spotube.git spotube

      - name: Apply FoxMusic core changes
        working-directory: spotube
        shell: pwsh
        run: |
          @'
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=
          LASTFM_API_SECRET=
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=1
          '@ | Set-Content -Encoding utf8 .env

          @'
          import 'package:spotube/models/database/database.dart';
          import 'package:spotube/services/youtube_engine/newpipe_engine.dart';
          import 'package:spotube/services/youtube_engine/youtube_engine.dart';
          import 'package:spotube/services/youtube_engine/yt_dlp_engine.dart';
          import 'package:youtube_explode_dart/youtube_explode_dart.dart';

          class FoxMediaEngine implements YouTubeEngine {
            final YoutubeClientEngine preferredEngine;
            final NewPipeEngine _newPipe = NewPipeEngine();
            final YtDlpEngine _ytDlp = YtDlpEngine();

            FoxMediaEngine(this.preferredEngine);

            YouTubeEngine get _primary =>
                preferredEngine == YoutubeClientEngine.ytDlp ? _ytDlp : _newPipe;

            Future<T> _run<T>(Future<T> Function(YouTubeEngine engine) action) async {
              final primary = _primary;
              try {
                return await action(primary);
              } catch (_) {
                if (identical(primary, _ytDlp)) {
                  return await action(_newPipe);
                }
                if (YtDlpEngine.isAvailableForPlatform && await YtDlpEngine.isInstalled()) {
                  return await action(_ytDlp);
                }
                rethrow;
              }
            }

            @override
            Future<Video> getVideo(String videoId) => _run((engine) => engine.getVideo(videoId));
            @override
            Future<StreamManifest> getStreamManifest(String videoId) => _run((engine) => engine.getStreamManifest(videoId));
            @override
            Future<(Video, StreamManifest)> getVideoWithStreamInfo(String videoId) => _run((engine) => engine.getVideoWithStreamInfo(videoId));
            @override
            Future<List<Video>> searchVideos(String query) => _run((engine) => engine.searchVideos(query));
            @override
            void dispose() {
              _newPipe.dispose();
              _ytDlp.dispose();
            }
          }
          '@ | Set-Content -Encoding utf8 lib/services/youtube_engine/fox_media_engine.dart

          @'
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:spotube/provider/user_preferences/user_preferences_provider.dart';
          import 'package:spotube/services/youtube_engine/fox_media_engine.dart';

          final youtubeEngineProvider = Provider((ref) {
            final engineMode = ref.watch(
              userPreferencesProvider.select((value) => value.youtubeClientEngine),
            );
            return FoxMediaEngine(engineMode);
          });
          '@ | Set-Content -Encoding utf8 lib/provider/youtube_engine/youtube_engine.dart

          $prefs = Get-Content lib/models/database/tables/preferences.dart -Raw
          $prefs = $prefs.Replace('withDefault(Constant(YoutubeClientEngine.youtubeExplode.name))', 'withDefault(Constant(YoutubeClientEngine.newPipe.name))')
          Set-Content lib/models/database/tables/preferences.dart $prefs -Encoding utf8

          $main = Get-Content lib/main.dart -Raw
          $main = $main.Replace('appName: "Spotube"', 'appName: "Fox Music"')
          $main = $main.Replace("title: 'Spotube'", "title: 'Fox Music'")
          Set-Content lib/main.dart $main -Encoding utf8

          $cmake = Get-Content windows/CMakeLists.txt -Raw
          $cmake = $cmake.Replace('project(spotube LANGUAGES CXX)', 'project(foxmusic LANGUAGES CXX)')
          $cmake = $cmake.Replace('set(BINARY_NAME "spotube")', 'set(BINARY_NAME "foxmusic")')
          Set-Content windows/CMakeLists.txt $cmake -Encoding utf8

          $runner = Get-Content windows/runner/main.cpp -Raw
          $runner = $runner.Replace('L"Spotube"', 'L"Fox Music"')
          Set-Content windows/runner/main.cpp $runner -Encoding utf8

          $rc = Get-Content windows/runner/Runner.rc -Raw
          $rc = $rc.Replace('VALUE "CompanyName", "KRTirtho"', 'VALUE "CompanyName", "SR.IGAMER TV"')
          $rc = $rc.Replace('VALUE "FileDescription", "spotube"', 'VALUE "FileDescription", "Fox Music"')
          $rc = $rc.Replace('VALUE "InternalName", "spotube"', 'VALUE "InternalName", "foxmusic"')
          $rc = $rc.Replace('VALUE "OriginalFilename", "spotube.exe"', 'VALUE "OriginalFilename", "foxmusic.exe"')
          $rc = $rc.Replace('VALUE "ProductName", "spotube"', 'VALUE "ProductName", "Fox Music"')
          Set-Content windows/runner/Runner.rc $rc -Encoding utf8

          $pub = Get-Content pubspec.yaml -Raw
          $pub = [regex]::Replace($pub, '(?m)^description:.*$', 'description: Fox Music - cross-platform music streaming app based on Spotube')
          $pub = [regex]::Replace($pub, '(?m)^version:.*$', 'version: 0.1.0+1')
          Set-Content pubspec.yaml $pub -Encoding utf8

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore and generate
        working-directory: spotube
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Release
        working-directory: spotube
        shell: pwsh
        run: flutter build windows --release

      - name: Package Windows build
        id: bundle
        working-directory: spotube
        shell: pwsh
        run: |
          $candidates = @('build/windows/x64/runner/Release','build/windows/runner/Release')
          $releaseDir = $candidates | Where-Object { Test-Path (Join-Path $_ 'foxmusic.exe') } | Select-Object -First 1
          if (-not $releaseDir) { throw 'foxmusic.exe not found after Flutter build.' }
          $full = (Resolve-Path $releaseDir).Path
          "release_dir=$full" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$releaseDir/*" -DestinationPath 'dist/FoxMusic_Windows_x64_v0.1.0.zip' -Force
          Copy-Item (Join-Path $releaseDir 'foxmusic.exe') 'dist/foxmusic.exe' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Create and build installer
        working-directory: spotube
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows/packaging/foxmusic -Force | Out-Null
          @'
          #define MyAppName "Fox Music"
          #define MyAppVersion "0.1.0"
          #define MyAppPublisher "SR.IGAMER TV"
          #define MyAppExeName "foxmusic.exe"
          #ifndef RELEASE_DIR
            #define RELEASE_DIR "build\\windows\\x64\\runner\\Release"
          #endif
          [Setup]
          AppId={{F9464971-C001-4F8B-A010-0F0100100001}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\\Fox Music
          DefaultGroupName=Fox Music
          OutputDir=..\\..\\..\\dist
          OutputBaseFilename=FoxMusic_v0.1.0_Setup_x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "{#RELEASE_DIR}\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\\Fox Music"; Filename: "{app}\\{#MyAppExeName}"
          Name: "{autodesktop}\\Fox Music"; Filename: "{app}\\{#MyAppExeName}"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Criar atalho na area de trabalho"; GroupDescription: "Atalhos:"; Flags: unchecked
          [Run]
          Filename: "{app}\\{#MyAppExeName}"; Description: "Abrir Fox Music"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content windows/packaging/foxmusic/foxmusic_installer.iss -Encoding utf8

          $iscc = @("$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          & $iscc "/DRELEASE_DIR=${{ steps.bundle.outputs.release_dir }}" 'windows/packaging/foxmusic/foxmusic_installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify outputs
        working-directory: spotube
        shell: pwsh
        run: |
          Get-Item 'dist/foxmusic.exe','dist/FoxMusic_Windows_x64_v0.1.0.zip','dist/FoxMusic_v0.1.0_Setup_x64.exe'
          Get-FileHash 'dist/foxmusic.exe' -Algorithm SHA256
          Get-FileHash 'dist/FoxMusic_v0.1.0_Setup_x64.exe' -Algorithm SHA256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FoxMusic-v0.1.0-Windows-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            spotube/dist/foxmusic.exe
            spotube/dist/FoxMusic_Windows_x64_v0.1.0.zip
            spotube/dist/FoxMusic_v0.1.0_Setup_x64.exe
